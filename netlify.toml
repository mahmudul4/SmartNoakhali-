[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/data/**", "public/downloads/**"]

[[headers]]
  for = "/downloads/*.apk"
  [headers.values]
    Content-Type = "application/vnd.android.package-archive"
    Content-Disposition = "attachment; filename=\"Smart-Noakhali-Android.apk\""
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/downloads/*.mobileconfig"
  [headers.values]
    Content-Type = "application/x-apple-aspen-config"
    Content-Disposition = "attachment; filename=\"Smart-Noakhali-iOS.mobileconfig\""
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/*"
  to = "/downloads/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
