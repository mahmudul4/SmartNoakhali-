# ==============================================================================
# Cloudflare Deployment Configuration (wrangler.toml)
# Project: Smart Noakhali (স্মার্ট নোয়াখালী)
# Architecture: React 19 + Vite SPA with Edge Functions
# ==============================================================================

name = "smart-noakhali"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Build Output Directory
pages_build_output_dir = "dist"

# Cloudflare Workers Static Assets Configuration
[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

[build]
command = "npm run build"
